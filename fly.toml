# fly.toml app configuration file generated for devis on 2026-06-07T21:24:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'devis'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/devis.db'
  FRONTEND_DIR = '/app/frontend'
  PORT = '8080'

[[mounts]]
  source = 'devis_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
